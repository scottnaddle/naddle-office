<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0c10;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" width="320" height="180"></canvas>
    <script>
      var canvas = document.getElementById('scene')
      var context = canvas.getContext('2d')
      window.naddleVideo = {
        durationMs: 2000,
        seek: function (ms) {
          context.fillStyle = '#0b0c10'
          context.fillRect(0, 0, 320, 180)
          context.fillStyle = '#f97316'
          context.fillRect((ms / 10) % 240, 70, 40, 40)
          context.fillStyle = '#e2e8f0'
          context.font = '20px sans-serif'
          context.fillText('V2 ' + ms, 10, 30)
        },
      }
      window.naddleVideo.seek(0)
    </script>
  </body>
</html>
